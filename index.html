<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<script>
/* Reviewers were sent per-campaign links (…/?c=wasabi-direct) back when the
   Content Studio lived at this URL. It now sits at /campaigns/ with HQ at the
   root, so forward those so nothing already shared with Brandon or Jessie
   breaks. Runs before anything else loads. */
(function () {
  var m = location.search.match(/[?&]c=([A-Za-z0-9_-]+)/);
  if (m) location.replace('campaigns/index.html?c=' + encodeURIComponent(m[1]));
})();
</script>
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>SportPharm HQ</title>
<meta name="robots" content="noindex, nofollow">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<!-- Bebas is gone: the masterbrand display face is native Arial/Helvetica, so
     there is nothing left to fetch for it. Inter stays for the UI text. -->
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&display=swap" rel="stylesheet">
<link rel="stylesheet" href="hq.css?v=55">
<link rel="icon" href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'><rect width='100' height='100' rx='18' fill='%230F1D33'/><path d='M50 16 L62 40 L88 44 L69 62 L74 88 L50 76 L26 88 L31 62 L12 44 L38 40 Z' fill='%23D6202A'/></svg>">
</head>
<body>

<!-- ===================== SIGN IN ===================== -->
<div class="gate" id="gate">
  <div class="gate-side">
    <div class="gate-brand">
      <img class="mark-img" src="assets/wordmark-white.png" alt="SportPharm">
      <p class="gate-tag">Sports recovery &amp; performance</p>
    </div>
    <p class="gate-line" id="gate-line"></p>
    <p class="gate-foot">Internal. Not indexed, not linked from anywhere public.</p>
  </div>

  <div class="gate-main">
    <div class="gate-card" id="gate-card"><!-- rendered by hq-app.js --></div>
  </div>
</div>

<!-- ===================== APP ===================== -->
<div class="app" id="app" hidden>

  <!-- Two rails, not one rail that expands. The narrow strip picks the
       section; the panel beside it lists that section's pages. -->
  <aside class="rail" id="rail">
    <div class="rail-icons">
      <a class="rail-mark" href="#/today" aria-label="SportPharm HQ">
        <svg class="mark" viewBox="0 0 100 100" aria-hidden="true">
          <rect width="100" height="100" rx="20" fill="#D6202A"/>
          <path d="M50 18 L61 40 L85 44 L67 61 L72 85 L50 74 L28 85 L33 61 L15 44 L39 40 Z" fill="#fff"/>
        </svg>
      </a>
      <nav class="rail-secs" id="rail-secs" aria-label="Sections"></nav>
    </div>
    <div class="rail-pages">
      <div class="rail-head" id="rail-head"></div>
      <nav class="rail-nav" id="rail-nav" aria-label="Pages"></nav>
      <button class="rail-me" id="rail-me"></button>
    </div>
  </aside>

  <div class="frame">
    <header class="topbar">
      <button class="tb-menu" id="tb-menu" aria-label="Menu">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"><path d="M4 7h16M4 12h16M4 17h16"/></svg>
      </button>
      <button class="tb-search" id="tb-search">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"><circle cx="11" cy="11" r="7"/><path d="m20 20-3.5-3.5"/></svg>
        <span>Search or jump to…</span>
        <kbd>⌘K</kbd>
      </button>
      <div class="tb-right" id="tb-right"></div>
    </header>
    <main class="view" id="view"></main>
  </div>

  <div class="scrim" id="scrim" hidden></div>

  <!-- detail sheet -->
  <aside class="sheet" id="sheet" hidden aria-label="Detail"></aside>

  <!-- command palette -->
  <div class="palette" id="palette" hidden>
    <div class="pal-box">
      <div class="pal-input">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"><circle cx="11" cy="11" r="7"/><path d="m20 20-3.5-3.5"/></svg>
        <input id="pal-q" type="text" placeholder="Search articles, campaigns, tasks — or jump somewhere…" autocomplete="off">
        <kbd>esc</kbd>
      </div>
      <div class="pal-results" id="pal-results"></div>
    </div>
  </div>

  <div class="toast" id="toast" hidden></div>
</div>

<script src="hq-data.js?v=55"></script>
<script src="hq-campaign-data.js?v=55"></script>
<script src="hq-articles-live.js?v=55"></script>
<script src="hq-config.js?v=55"></script>
<script src="vendor/supabase.js"></script>
<script src="hq-studio-sync.js?v=55"></script>
<script src="hq-store.js?v=55"></script>
<script src="hq-cloud.js?v=55"></script>
<script src="hq-app.js?v=55"></script>
<script src="hq-views.js?v=55"></script>
<script src="hq-cms.js?v=55"></script>
<script src="hq-campaigns.js?v=55"></script>
<script src="hq-mailer.js?v=55"></script>
<script src="hq-orders.js?v=55"></script>
<script src="hq-plan.js?v=55"></script>
<script src="hq-boot.js?v=55"></script>
</body>
</html>
